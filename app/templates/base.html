<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Artificer's Workshop{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #1a1208;
      color: #d4b483;
      min-height: 100vh;
    }
    header {
      background: #0d0a04;
      border-bottom: 2px solid #7a5c2e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.4rem;
      color: #e8c87a;
      letter-spacing: 0.05em;
    }
    nav a {
      color: #a08040;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
    }
    nav a:hover { color: #e8c87a; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: #e8c87a; margin-bottom: 1rem; font-size: 1.2rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      text-align: left;
      border-bottom: 1px solid #7a5c2e;
      padding: 0.5rem 0.75rem;
      color: #a08040;
      font-weight: normal;
    }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a1f0a; }
    tr:hover td { background: #221808; }
    a { color: #c8963c; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-size: 0.8rem;
      font-family: monospace;
    }
    .badge-submitted  { background:#2a2010; color:#a08040; }
    .badge-researching{ background:#102030; color:#4090c0; }
    .badge-building   { background:#201020; color:#a040c0; }
    .badge-testing    { background:#102010; color:#40a040; }
    .badge-complete   { background:#0a1a0a; color:#30c030; }
    .badge-failed     { background:#1a0a0a; color:#c03030; }
    .badge-pending    { background:#2a2010; color:#a08040; }
    .badge-processing { background:#201020; color:#a040c0; }
    form { margin-top: 1.5rem; }
    label {
      display: block;
      font-size: 0.85rem;
      color: #a08040;
      margin-bottom: 0.25rem;
    }
    input, textarea, select {
      width: 100%;
      background: #0d0a04;
      border: 1px solid #7a5c2e;
      color: #d4b483;
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.75rem;
      font-family: Georgia, serif;
      font-size: 0.9rem;
    }
    textarea { min-height: 80px; resize: vertical; }
    button, .btn {
      background: #7a5c2e;
      color: #e8c87a;
      border: none;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 0.9rem;
    }
    button:hover, .btn:hover { background: #a08040; }
    .panel {
      background: #0d0a04;
      border: 1px solid #7a5c2e;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .panel p { margin: 0.3rem 0; font-size: 0.9rem; }
    .muted { color: #6a5030; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>&#9878; The Artificer's Workshop</h1>
    <nav>
      <a href="/">Workshop</a>
      <a href="/scrying">&#128302; Scrying Chamber</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
